  case_id: sweeper-107
  build: A
  workflow: target
  data_split: train
  family: multifield_with_steps
  fixture:
    version: 1.1.0
    summary: Invoice validation message is missing
    description: Submit an invoice with an invalid billing postcode. The page remains
      on the form without explaining which field needs correction.
