experiences:
  - case_id: sweeper-105
    workflow: preservation
    task: >-
      Use the displayed Geo Zone editor. Create a new Geo Zone. Set Name to
      'Warehouse collection'; Code to 'wh'; Description to 'Collect after the
      confirmation email.'. Leave the pending Country unselected and do not
      click Add. Click Save, reopen this same zone from its list row, and verify
      Code, Name and Description. Inspect the saved country rows in the table
      body; the pending dropdown does not count. Report pass if all requested
      fields and the requested country/city are saved (or no country row exists
      when none was selected), fail if the completed save reopens with missing
      or different values, or blocked if the check cannot be completed.
    procedure:
      - Focus each requested text field, select all, enter the current task's replacement, and inspect the visible text.
      - Complete the requested fields, click the form's Save button, and inspect the saved-record list.
      - Reopen the same record from its list row and compare the requested fields with the current task.
    lessons:
      - Creating a record requires submitting the form and reopening the saved record after entering its fields.
      - Inspect saved child-table rows separately from pending dropdown selections and Add controls.
