  - case_id: sweeper-125
    workflow: target
    task: >-
      Edit Apple Cinema 30" product #42 in OpenCart. Open the Option tab. Open
      the option value editor for Green; set Weight to 0.75. Keep the + prefix
      and leave other fields unchanged. Save the modal, then save the product.
      Reload the product, reopen Option, and read the same row's displayed
      Weight. Report pass if the reopened values match the request, fail if
      they differ, or blocked if you cannot complete the check.
    procedure:
      - Open the requested record's tab and the matching child-row editor; replace the requested field while preserving its prefix and unrelated fields.
      - Save the child editor, then save the enclosing record form and inspect its submission response.
      - Reload the record, reopen its tab, scroll to the same child row, and inspect the requested field.
    lessons:
      - Saving a nested modal and saving its enclosing record are separate actions.
      - After reloading, identify the same child row before comparing its field; neighboring rows describe different records.
    source_run_id: 20261107T160406Z-3f79b1b7
