notes:
  sweeper-004: 官方 target 终止于检查 multi-row Edit 的默认选项，没有要求点击 Save，归 O。
  sweeper-024: 密码重置包含邮件或令牌链路，归 A；不归普通导航，也不列入本轮主训练。
  sweeper-034: 官方媒体 ACL 为 N；本项目另有页面正文编辑的 supplementary F 流程。
  sweeper-053: 官方 PrettyURLs 为 N；本项目另有静态页正文编辑的 supplementary F 流程。
  sweeper-066: 表单保存后检查生成链接，但官方要求读取 href；接入截图协议前需改为可见 URL 证据。
  sweeper-084: target 保存表单为 F，preservation 只打开 General Settings 为 O。
  sweeper-112: 原文称 upload，但两条 workflow 实际均填写 textarea 创建文本条目，没有文件上传，归 F。
  sweeper-184: 两条流程先经 UI 创建用户再登录验证，归 F；原文含 Vue 内部状态操作，暂缓截图采集。
