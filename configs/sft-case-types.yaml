reviewed_on: "2026-11-07"
basis: >-
  按原始 workflow 的实际触发动作和终局证据分别核对 target/preservation，
  不使用任务关键词打分。F 包含保存后通过列表、详情或重新登录验证；
  只打开编辑器或检查默认值归 O。每行依次为 target、preservation。
categories:
  F: 表单填写或编辑、提交保存、验证结果
  V: 表单校验、拒绝无效提交、验证原状态
  O: 表单打开、字段回填、候选项或输入联动，未完成保存
  L: 对象操作、删除、移动、复制、重排或状态切换
  N: 导航、搜索筛选、页面展示或访问权限观察
  X: 文件上传、导入、导出或下载
  A: 登录、邀请、邮件或令牌密码重置流程
  B: 多阶段业务流程、外部服务或文件扫描联动
