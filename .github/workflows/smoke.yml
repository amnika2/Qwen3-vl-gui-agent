name: CPU smoke
on:
  workflow_dispatch:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -e '.[test,agent]'
      - run: python -m playwright install --with-deps chromium
      - run: xargs pytest --junitxml=reports/smoke.xml < configs/ci-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guiqa-smoke
          path: reports/
